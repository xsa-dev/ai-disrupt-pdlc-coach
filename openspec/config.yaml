schema: spec-driven

# Project context
context: |
  Project: Disrupt PDLC Coach
  Description: Внутренний Telegram-агент-коуч для инженерных команд по методологии AI-Disrupt PDLC (белая книга Альвианского).
  Цель: Помогать командам проводить честную диагностику зрелости (L0-L5, R0-R5), строить roadmap трансформации, проектировать среду агентов, валидацию и Governance Mesh.
  Ключевые принципы (обязательно соблюдать):
    - Среда работы ИИ-агентов важнее модели
    - Человек — субъект петли намерения, агент — субъект петли реализации
    - Governance Mesh — третья ось PDLC (встроен в реальном времени)
    - Валидация встроена (Evidence Bundle, агент-ревьюер)
    - Честная оценка зрелости важнее завышения уровней
  Основной интерфейс: Telegram
  Поддержка: Мультикомандность с изолированным контекстом
  Будущие расширения: Добавление внутренних кейсов организации

# Правила для артефактов
rules:
  proposal:
    - Всегда ссылаться на принципы из AI-Disrupt PDLC
    - Включать раздел Non-goals
    - Указывать измеримые критерии успеха
  spec:
    - Использовать терминологию из книги (L0-L5, R0-R5, Evidence Bundle, Guardian Agents, Zero Friction и т.д.)
  tasks:
    - Разбивать на мелкие задачи (максимум 1-2 часа)
    - Указывать acceptance criteria
    - Отмечать зависимости от других задач